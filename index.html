<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIR Ladder — Practice with a plan</title>
<meta name="description" content="A personalised practice and rank-tracking prototype for JEE, NEET and Class 12 students.">
<meta name="theme-color" content="#0b1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="styles/main.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <header class="top">
    <a class="brand" href="#dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 2v20M19 2v20"/><path d="M5 7h14M5 12h14M5 17h14"/></svg>
      AIR Ladder
    </a>
    <div class="seg" id="examseg" role="group" aria-label="Exam"></div>
    <div class="chips">
      <div class="chip chip-lv" title="Level from your answers"><small>Level</small><b id="xpv">1</b></div>
      <div class="chip" title="Days in a row with at least one submission"><small>Streak</small><b id="streakv">0d</b></div>
      <div class="chip" title="Modelled estimate from your answers"><small id="chiplab">Est. AIR</small><b id="chipv">-</b></div>
    </div>
    <div id="userbox" class="userbox"></div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#dashboard" data-r="dashboard">Dashboard</a>
    <a href="#problems" data-r="problems">Problems</a>
    <a href="#analytics" data-r="analytics">Analytics</a>
    <a href="#contest" data-r="contest">Board</a>
    <a href="#profile" data-r="profile">Profile</a>
  </nav>
  <main id="view" tabindex="-1"></main>
  <footer>
    <span>A practice notebook, not a scoreboard.</span>
    <span>27 sample questions · simulated cohorts and boards · modelled rank estimates, not official predictions.</span>
    <span>Local-first prototype · your data stays on this device.</span>
  </footer>
</div>
<div id="authroot"></div>
<script src="questions.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
